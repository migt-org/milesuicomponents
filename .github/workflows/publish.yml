name: Publish Miles Packages
on:
  push:
    branches:
      - main
    paths:
      - '/**'  

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
        working-directory: ./
      - name: Build packages
        run: npm run build
        working-directory: ./
      - name: Publish packages
        run: npm publish --access public
        working-directory: ./
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}